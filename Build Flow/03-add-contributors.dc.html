<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#090A0B;color:#F3F3EE;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:#B8FF3D;color:#090A0B;}
  a{color:#F3F3EE;text-decoration:none;}
  p{text-wrap:pretty;}
  input{font-family:'Inter',sans-serif;}
  input::placeholder{color:#5b6065;}
  input:focus{outline:none;border-color:rgba(243,243,238,0.4)!important;}
  .opt:hover{border-color:rgba(243,243,238,0.3)!important;}
</style>
</helmet>
<div style="background:#090A0B;color:#F3F3EE;min-height:100vh;display:flex;flex-direction:column;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,4vw,32px);border-bottom:1px solid rgba(243,243,238,0.08);">
    <span></span>
    <a href="../Dashboard/dashboard-active.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#8B9095;">CANCEL</a>
  </header>

  <main style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(36px,7vh,80px) 24px;">
    <div style="width:100%;max-width:460px;">

      <div style="display:flex;gap:5px;height:2px;margin-bottom:40px;">
        <span style="flex:1;height:2px;border-radius:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;border-radius:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;border-radius:2px;background:#F3F3EE;"></span>
      </div>

      <h1 style="font-size:clamp(28px,6.5vw,38px);line-height:1.06;letter-spacing:-0.03em;font-weight:600;margin:0 0 12px;">Who's contributing?</h1>
      <p style="font-size:17px;line-height:1.5;color:#8B9095;margin:0 0 32px;">This becomes part of the record. It shows how much of the work was you, an agent, or a team.</p>

      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:36px;">

        <!-- JUST ME -->
        <button onClick="{{ selJustMe }}" class="opt" style="{{ styleJustMe }}">
          <span style="display:flex;align-items:center;gap:14px;">
            <span style="{{ dotJustMe }}"></span>
            <span style="font-size:16px;font-weight:500;color:#F3F3EE;">Just me</span>
          </span>
        </button>

        <!-- ME AND AI AGENTS -->
        <div class="opt" style="{{ styleAgents }}">
          <button onClick="{{ selAgents }}" style="display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:none;padding:0;cursor:pointer;text-align:left;">
            <span style="{{ dotAgents }}"></span>
            <span style="font-size:16px;font-weight:500;color:#F3F3EE;">Me and AI agents</span>
          </button>
          <sc-if value="{{ isAgents }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:18px;padding-top:18px;border-top:1px solid rgba(243,243,238,0.1);">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#8B9095;text-transform:uppercase;margin-bottom:12px;">Which agent?</div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#F3F3EE;background:#090A0B;border:1px solid rgba(243,243,238,0.16);border-radius:6px;padding:10px 14px;cursor:pointer;">Connect an agent</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B9095;background:#090A0B;border:1px solid rgba(243,243,238,0.16);border-radius:6px;padding:10px 14px;cursor:pointer;">Select from your agents</span>
            </div>
          </div>
          </sc-if>
        </div>

        <!-- A TEAM -->
        <div class="opt" style="{{ styleTeam }}">
          <button onClick="{{ selTeam }}" style="display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:none;padding:0;cursor:pointer;text-align:left;">
            <span style="{{ dotTeam }}"></span>
            <span style="font-size:16px;font-weight:500;color:#F3F3EE;">A team</span>
          </button>
          <sc-if value="{{ isTeam }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:18px;padding-top:18px;border-top:1px solid rgba(243,243,238,0.1);">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#8B9095;text-transform:uppercase;margin-bottom:12px;">Add teammates by @username</div>
            <input type="text" placeholder="@username" style="width:100%;background:#090A0B;border:1px solid rgba(243,243,238,0.16);border-radius:7px;padding:13px 15px;font-size:15px;color:#F3F3EE;">
          </div>
          </sc-if>
        </div>

      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
        <a href="02-connect-work.dc.html" style="font-size:15px;font-weight:500;color:#8B9095;">Back</a>
        <a href="04-build-created.dc.html" style="display:inline-block;font-size:15px;font-weight:550;color:#090A0B;background:#F3F3EE;border-radius:7px;padding:14px 30px;">Create Build</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sel: 'justme' };
  _card(active) {
    return [
      'display:block','width:100%','background:#131517',
      'border:1px solid ' + (active ? 'rgba(243,243,238,0.45)' : 'rgba(243,243,238,0.14)'),
      'border-radius:10px','padding:18px 20px','cursor:pointer','transition:border-color .15s','text-align:left',
    ].join(';');
  }
  _dot(active) {
    return [
      'width:18px','height:18px','border-radius:50%','flex:none',
      'border:1px solid ' + (active ? '#B8FF3D' : 'rgba(243,243,238,0.3)'),
      'background:' + (active ? '#B8FF3D' : 'transparent'),
      'box-shadow:' + (active ? 'inset 0 0 0 3px #131517' : 'none'),
    ].join(';');
  }
  renderVals() {
    const s = this.state.sel;
    return {
      styleJustMe: this._card(s === 'justme'),
      styleAgents: this._card(s === 'agents'),
      styleTeam: this._card(s === 'team'),
      dotJustMe: this._dot(s === 'justme'),
      dotAgents: this._dot(s === 'agents'),
      dotTeam: this._dot(s === 'team'),
      isAgents: s === 'agents',
      isTeam: s === 'team',
      selJustMe: () => this.setState({ sel: 'justme' }),
      selAgents: () => this.setState({ sel: 'agents' }),
      selTeam: () => this.setState({ sel: 'team' }),
    };
  }
}
</script>
</body>
</html>
