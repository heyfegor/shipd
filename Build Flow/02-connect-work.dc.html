<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#090A0B;color:#F3F3EE;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:#B8FF3D;color:#090A0B;}
  a{color:#F3F3EE;text-decoration:none;}
  p{text-wrap:pretty;}
  .ghBtn:hover{border-color:rgba(243,243,238,0.4)!important;}
</style>
</helmet>
<div style="background:#090A0B;color:#F3F3EE;min-height:100vh;display:flex;flex-direction:column;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,4vw,32px);border-bottom:1px solid rgba(243,243,238,0.08);">
    <span></span>
    <a href="../Dashboard/dashboard-active.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#8B9095;">CANCEL</a>
  </header>

  <main style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(36px,7vh,80px) 24px;">
    <div style="width:100%;max-width:460px;">

      <div style="display:flex;gap:5px;height:2px;margin-bottom:40px;">
        <span style="flex:1;height:2px;border-radius:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;border-radius:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;border-radius:2px;background:#26292c;"></span>
      </div>

      <h1 style="font-size:clamp(28px,6.5vw,38px);line-height:1.06;letter-spacing:-0.03em;font-weight:600;margin:0 0 12px;">Where is the work happening?</h1>
      <p style="font-size:17px;line-height:1.5;color:#8B9095;margin:0 0 34px;">Connect the repository where this build actually lives. This is what gets checked when you submit for verification.</p>

      <div style="margin-bottom:14px;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#8B9095;text-transform:uppercase;margin-bottom:14px;">Repository</div>
        <button onClick="{{ ghClick }}" class="ghBtn" style="{{ ghStyle }}">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="#F3F3EE" style="flex:none;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <span style="font-size:14.5px;font-weight:500;color:#F3F3EE;white-space:nowrap;">{{ ghLabel }}</span>
        </button>
      </div>

      <div style="margin-bottom:40px;"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
        <a href="01-start-a-build.dc.html" style="font-size:15px;font-weight:500;color:#8B9095;">Back</a>
        <a href="{{ continueHref }}" onClick="{{ continueClick }}" style="{{ continueStyle }}">Continue</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { phase: 'idle' };
  renderVals() {
    const p = this.state.phase;
    const selected = p === 'selected';
    return {
      ghStyle: [
        'display:inline-flex','align-items:center','gap:11px',
        'background:#1A1D1F','border:1px solid ' + (selected ? 'rgba(184,255,61,0.4)' : 'rgba(243,243,238,0.16)'),
        'border-radius:999px','padding:12px 20px','cursor:pointer','transition:border-color .15s',
      ].join(';'),
      ghLabel: p === 'idle' ? 'Connect GitHub' : (p === 'connected' ? 'Select repository' : 'ada/monad-payment-router'),
      ghClick: () => this.setState(s => ({ phase: s.phase === 'idle' ? 'connected' : (s.phase === 'connected' ? 'selected' : 'connected') })),
      continueHref: selected ? '03-add-contributors.dc.html' : '#',
      continueClick: (e) => { if (!selected) e.preventDefault(); },
      continueStyle: [
        'display:inline-block','font-size:15px','font-weight:550','border-radius:7px','padding:14px 30px',
        'color:' + (selected ? '#090A0B' : '#5b6065'),
        'background:' + (selected ? '#F3F3EE' : '#1A1D1F'),
        'cursor:' + (selected ? 'pointer' : 'not-allowed'),
        'pointer-events:auto',
      ].join(';'),
    };
  }
}
</script>
</body>
</html>
