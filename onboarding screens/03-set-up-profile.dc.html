<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#090A0B;color:#F3F3EE;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:#B8FF3D;color:#090A0B;}
  a{color:#F3F3EE;text-decoration:none;}
  p{text-wrap:pretty;}
  input{font-family:'Inter',sans-serif;}
  input::placeholder{color:#5b6065;}
  input:focus{outline:none;border-color:rgba(243,243,238,0.4)!important;}
</style>
</helmet>
<div style="background:#090A0B;color:#F3F3EE;min-height:100vh;display:flex;flex-direction:column;">

  <header style="display:flex;align-items:center;padding:26px 20px;border-bottom:1px solid rgba(243,243,238,0.08);">
    <a href="02-create-identity.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:#8B9095;">← BACK</a>
  </header>

  <main style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(40px,7vh,80px) 24px;">
    <div style="width:100%;max-width:440px;">

      <div style="display:flex;gap:5px;margin-bottom:36px;">
        <span style="flex:1;height:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;background:#F3F3EE;"></span>
        <span style="flex:1;height:2px;background:#26292c;"></span>
      </div>

      <h1 style="font-size:clamp(28px,6.5vw,38px);line-height:1.06;letter-spacing:-0.03em;font-weight:600;margin:0 0 16px;">Set up your profile</h1>
      <p style="font-size:17px;line-height:1.5;color:#8B9095;margin:0 0 38px;">Tell us a little about the person behind the work. This information will be shown on your Shipd profile and help people understand what you build.</p>

      <div style="display:flex;flex-direction:column;gap:22px;margin-bottom:36px;">
        <div>
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#F3F3EE;margin-bottom:9px;">NAME</label>
          <input type="text" placeholder="Your name" style="width:100%;background:#131517;border:1px solid rgba(243,243,238,0.14);border-radius:7px;padding:14px 16px;font-size:16px;color:#F3F3EE;">
        </div>
        <div>
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#F3F3EE;margin-bottom:9px;">USERNAME</label>
          <div style="display:flex;align-items:center;background:#131517;border:1px solid rgba(243,243,238,0.14);border-radius:7px;padding:0 16px;">
            <span style="font-size:16px;color:#5b6065;font-family:'JetBrains Mono',monospace;">@</span>
            <input type="text" placeholder="Choose a unique username" style="flex:1;background:transparent;border:none;padding:14px 8px;font-size:16px;color:#F3F3EE;">
          </div>
        </div>
        <div>
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#F3F3EE;margin-bottom:9px;">WHAT DO YOU DO?</label>
          <input type="text" placeholder="Your primary role or area of work" style="width:100%;background:#131517;border:1px solid rgba(243,243,238,0.14);border-radius:7px;padding:14px 16px;font-size:16px;color:#F3F3EE;">
        </div>
      </div>

      <a href="04-identity-created.dc.html" style="display:block;text-align:center;font-size:16px;font-weight:550;color:#090A0B;background:#F3F3EE;border-radius:7px;padding:16px 24px;">Continue</a>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
